services:
  - type: web
    name: apex-talent-management
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_BOOTSTRAP_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: apex-talent-db
          property: connectionString

databases:
  - name: apex-talent-db
    plan: free
    region: frankfurt
    databaseName: apex_talent
    user: apex_admin
